spring:
  application:
    name: colegio-profesional-api

  datasource:
    url: jdbc:mysql://localhost:3306/colegio_profesional?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: America/Lima
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Lima
    date-format: yyyy-MM-dd HH:mm:ss

  task:
    scheduling:
      pool:
        size: 5

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

# Configuración de seguridad JWT
security:
  jwt:
    secret: colegio_profesional_secret_key_2025_change_in_production
    expiration: 86400000 # 24 horas en milisegundos

# Configuración del colegio
colegio:
  cuota-mensual-default: 150.00
  meses-tolerancia-impago: 3
  dia-generacion-cuotas: 1
  dia-vencimiento-cuotas: 15
  nombre: Colegio Profesional
  email-notificaciones: notificaciones@colegio.com

# Configuración de documentación API (Swagger)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    root: INFO
    com.colegio: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/colegio-profesional.log
    max-size: 10MB
    max-history: 30
